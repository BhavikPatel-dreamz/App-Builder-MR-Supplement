# India PoP cache for native catalog GET traffic.
# Install on dd-106. HIT is local (~10–30ms). MISS proxies to app origin.
#
# Do not cache: /app, /admin, /auth, /webhooks, /api/cron, POST.

proxy_cache_path /var/cache/nginx/catalog
  levels=1:2
  keys_zone=catalog:64m
  max_size=8g
  inactive=24h
  use_temp_path=off;

upstream appbuilder_origin {
  server appbuilder.dreamzapps.com:443;
  keepalive 32;
}

map $request_method $catalog_skip_cache {
  default 0;
  POST    1;
  PUT     1;
  PATCH   1;
  DELETE  1;
}

server {
  listen 8088;
  server_name _;

  # Native app should later use TLS + this hostname, not raw 8088.
  add_header X-India-Cache $upstream_cache_status always;
  add_header X-India-Pop dd-106 always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(app|admin|auth|webhooks|api/cron|api/auth) {
    proxy_cache off;
    proxy_pass https://appbuilder_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name appbuilder.dreamzapps.com;
    proxy_set_header Host appbuilder.dreamzapps.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location / {
    proxy_cache catalog;
    proxy_cache_methods GET HEAD;
    proxy_cache_key $scheme$request_method$host$request_uri;
    proxy_cache_valid 200 30m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 8s;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Vary;
    proxy_cache_bypass $catalog_skip_cache;
    proxy_no_cache $catalog_skip_cache;

    proxy_pass https://appbuilder_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name appbuilder.dreamzapps.com;
    proxy_set_header Host appbuilder.dreamzapps.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    keepalive_timeout 65s;
  }
}
