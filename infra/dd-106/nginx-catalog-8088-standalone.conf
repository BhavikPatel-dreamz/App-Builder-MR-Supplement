# Full nginx.conf for aaPanel nginx on dd-106 (no /etc/nginx).
# Listens only on 8088. Does not touch Apache :80.
#
#   mkdir -p /tmp/nginx-catalog-cache
#   sudo /www/server/nginx/sbin/nginx -t -c /media/drive/Bhavik/Projects/shopify/app-builder-mr-supplement/infra/dd-106/nginx-catalog-8088-standalone.conf
#   sudo /www/server/nginx/sbin/nginx -c /media/drive/Bhavik/Projects/shopify/app-builder-mr-supplement/infra/dd-106/nginx-catalog-8088-standalone.conf

worker_processes auto;
error_log /tmp/nginx-catalog-8088.error.log;
pid /tmp/nginx-catalog-8088.pid;

events {
  worker_connections 1024;
}

http {
  # aaPanel OpenResty — without this, nginx exits on resty.core
  lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
  include /www/server/nginx/conf/mime.types;
  default_type application/json;
  access_log /tmp/nginx-catalog-8088.access.log;

  proxy_cache_path /tmp/nginx-catalog-cache
    levels=1:2
    keys_zone=catalog:64m
    max_size=2g
    inactive=24h
    use_temp_path=off;

  upstream appbuilder_origin {
    server appbuilder.dreamzapps.com:443;
    keepalive 32;
  }

  map $request_method $catalog_skip_cache {
    default 0;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
  }

  server {
    listen 8088;
    server_name _;

    add_header X-India-Cache $upstream_cache_status always;
    add_header X-India-Pop dd-106 always;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location ~ ^/(app|admin|auth|webhooks|api/cron|api/auth) {
      proxy_cache off;
      proxy_pass https://appbuilder_origin;
      proxy_ssl_server_name on;
      proxy_ssl_name appbuilder.dreamzapps.com;
      proxy_set_header Host appbuilder.dreamzapps.com;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location / {
      proxy_cache catalog;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $scheme$request_method$host$request_uri;
      proxy_cache_valid 200 30m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 8s;
      proxy_cache_background_update on;
      proxy_cache_revalidate on;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      proxy_hide_header Vary;
      proxy_cache_bypass $catalog_skip_cache;
      proxy_no_cache $catalog_skip_cache;

      proxy_pass https://appbuilder_origin;
      proxy_ssl_server_name on;
      proxy_ssl_name appbuilder.dreamzapps.com;
      proxy_set_header Host appbuilder.dreamzapps.com;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
