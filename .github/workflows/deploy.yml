name: Deploy App Builder Mr Supplement app

on:
  push:
    branches: [main]

env:
  VPS_APP_PATH: "/var/www/html/App-Builder-Supplement"
  PM2_PROCESS_NAME: "App-Builder-Supplement"
  
jobs:
  # 0. VIRUS / MALWARE SCAN — must pass before validate or deploy.
  #    A failed scan skips every later job (no server pull).
  security-scan:
    name: Virus / malware scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run malware indicator + scanner
        run: |
          set -euo pipefail
          bash .githooks/pre-commit --ci

  # 1. Validate on GitHub's own runner FIRST — nothing on the server is touched yet.
  validate:
    needs: security-scan
    if: ${{ needs.security-scan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:ci

      # Optional but recommended — add if you have these scripts
      # - name: Lint
      #   run: pnpm run lint
      # - name: Test
      #   run: pnpm run test

  # 2. Only runs if scan + validate succeeded. Deploys + builds again on the VPS itself,
  #    since the validate job's build artifacts aren't on the server.
  deploy:
    needs: [security-scan, validate]
    if: ${{ needs.security-scan.result == 'success' && needs.validate.result == 'success' }}
    runs-on: [self-hosted]
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Capture Current Release
        run: |
          set -euo pipefail
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
            cd "${{ env.VPS_APP_PATH }}"
            PREV_SHA="$(git rev-parse HEAD 2>/dev/null || echo '')"
          else
            PREV_SHA=""
          fi
          echo "PREV_SHA=${PREV_SHA}" >> "$GITHUB_ENV"
          echo "Previous release: ${PREV_SHA:-<none, fresh clone>}"

      - name: Sync Code
        run: |
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
              cd "${{ env.VPS_APP_PATH }}"
              git fetch origin
              git reset --hard "origin/main"
              git clean -fd
          else
              git clone -b main git@github.com:BhavikPatel-dreamz/checkout-upsell-app.git "${{ env.VPS_APP_PATH }}"
          fi

      - name: Virus / malware scan (block server deploy if infected)
        id: malware_scan
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          bash .githooks/pre-commit --ci

      - name: Restore previous release after failed scan
        if: ${{ failure() && steps.malware_scan.outcome == 'failure' && env.PREV_SHA != '' }}
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          git reset --hard "${{ env.PREV_SHA }}"

      - name: Build on server
        run: |
          cd "${{ env.VPS_APP_PATH }}"
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Start App
        run: |
          cd "${{ env.VPS_APP_PATH }}"
          if pm2 list | grep -q "${{ env.PM2_PROCESS_NAME }}"; then
              pm2 restart "${{ env.PM2_PROCESS_NAME }}"
          else
              pm2 start npm --name "${{ env.PM2_PROCESS_NAME }}" -- start
          fi
          pm2 save