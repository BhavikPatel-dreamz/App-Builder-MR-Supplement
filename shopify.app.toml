# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "10c2ab08d8b0e48ea49842bb978146fa"
name = "App Builder MR-Supplement"
application_url = "https://ab.mrsupplement.com.au"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # TEMPORARY: catalog webhooks paused until production server deploy.
  # Uncomment these, then run `pnpm deploy` (shopify app deploy) to re-subscribe.
   [[webhooks.subscriptions]]
   uri = "/webhooks/products/create"
   topics = [ "products/create" ]
  
   [[webhooks.subscriptions]]
   uri = "/webhooks/products/update"
   topics = [ "products/update" ]
  
   [[webhooks.subscriptions]]
   uri = "/webhooks/products/delete"
   topics = [ "products/delete" ]
  
   [[webhooks.subscriptions]]
   uri = "/webhooks/collections/update"
   topics = [ "collections/update" ]
  
   [[webhooks.subscriptions]]
   uri = "/webhooks/collections/create"
   topics = [ "collections/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Do not add read_mobile_platform_applications or write_mobile_platform_applications
# until Shopify Support enables them. Partner version creation fails with
# do not update
# app_access validation on those scopes before they are enabled.
scopes = "read_mobile_platform_applications,write_mobile_platform_applications,write_metaobject_definitions,write_metaobjects,write_products,read_files,write_files"

[auth]
redirect_urls = [ "https://ab.mrsupplement.com.au/api/auth" ]
