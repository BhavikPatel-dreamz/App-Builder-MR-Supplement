name: Deploy App Builder Mr Supplement app

on:
  push:
    branches: [main]

env:
  VPS_APP_PATH: "/var/www/html/App-Builder-Supplement"
  PM2_PROCESS_NAME: "App-Builder-Supplement"
  PORT: "3500"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

jobs:
  # 1. Validate on GitHub's own runner FIRST — nothing on the server is touched yet.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:ci

      # Optional but recommended — add if you have these scripts
      # - name: Lint
      #   run: pnpm run lint
      # - name: Test
      #   run: pnpm run test

  # 2. Only runs if validate succeeded. Deploys + builds on the VPS.
  #    Malware scan runs after sync, before install.
  deploy:
    needs: [validate]
    if: ${{ needs.validate.result == 'success' }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Capture Current Release
        run: |
          set -euo pipefail
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
            cd "${{ env.VPS_APP_PATH }}"
            PREV_SHA="$(git rev-parse HEAD 2>/dev/null || echo '')"
          else
            PREV_SHA=""
          fi
          echo "PREV_SHA=${PREV_SHA}" >> "$GITHUB_ENV"
          echo "Previous release: ${PREV_SHA:-<none, fresh clone>}"

      - name: Sync Code
        run: |
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
              cd "${{ env.VPS_APP_PATH }}"
              git fetch origin
              git reset --hard "origin/main"
              git clean -fd
          else
              git clone -b main git@github.com:BhavikPatel-dreamz/checkout-upsell-app.git "${{ env.VPS_APP_PATH }}"
          fi

      - name: Virus / malware scan (block server deploy if infected)
        id: malware_scan
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          bash .githooks/pre-commit --ci

      - name: Restore previous release after failed scan
        if: ${{ failure() && steps.malware_scan.outcome == 'failure' && env.PREV_SHA != '' }}
        run: |
          set -euo pipefail
          cd "${{ env.VPS_APP_PATH }}"
          git reset --hard "${{ env.PREV_SHA }}"

      - name: Build on server
        run: |
          cd "${{ env.VPS_APP_PATH }}"
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Start App
        run: |
          set -euo pipefail
          APP_PATH="${{ env.VPS_APP_PATH }}"
          PROCESS_NAME="${{ env.PM2_PROCESS_NAME }}"
          PORT="${{ env.PORT }}"
          cd "$APP_PATH"
          export PORT

          listen_pids() {
            if command -v ss >/dev/null 2>&1; then
              ss -lptn "sport = :${PORT}" 2>/dev/null | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u || true
            elif command -v lsof >/dev/null 2>&1; then
              lsof -t -iTCP:"${PORT}" -sTCP:LISTEN 2>/dev/null | sort -u || true
            elif command -v fuser >/dev/null 2>&1; then
              fuser "${PORT}/tcp" 2>/dev/null | tr -s '[:space:]' '\n' | grep -E '^[0-9]+$' | sort -u || true
            else
              echo "ERROR: Cannot check port ${PORT} (ss, lsof, and fuser are all missing)." >&2
              exit 1
            fi
          }

          our_tree_pids() {
            local root
            root="$(pm2 pid "$PROCESS_NAME" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ -z "$root" ] || [ "$root" = "0" ]; then
              return 0
            fi
            echo "$root"
            collect_descendants() {
              local parent="$1" child
              for child in $(pgrep -P "$parent" 2>/dev/null || true); do
                echo "$child"
                collect_descendants "$child"
              done
            }
            collect_descendants "$root"
          }

          is_our_pid() {
            local pid="$1"
            if [ -n "${OUR_PIDS:-}" ] && echo "$OUR_PIDS" | grep -qx "$pid"; then
              return 0
            fi
            local cwd
            cwd="$(readlink -f "/proc/${pid}/cwd" 2>/dev/null || true)"
            [ -n "$cwd" ] && [ "$cwd" = "$APP_PATH" ]
          }

          report_conflict() {
            local pid="$1"
            local cmd cwd
            cmd="$(ps -p "$pid" -o args= 2>/dev/null || echo unknown)"
            cwd="$(readlink -f "/proc/${pid}/cwd" 2>/dev/null || echo unknown)"
            echo "============================================"
            echo "ERROR: Port ${PORT} is already in use by another process."
            echo "This deploy will not start ${PROCESS_NAME} on a port owned by another repo."
            echo
            echo "  Port:              ${PORT}"
            echo "  Conflicting PID:   ${pid}"
            echo "  Command:           ${cmd}"
            echo "  Working directory: ${cwd}"
            echo "  Our PM2 process:   ${PROCESS_NAME}"
            echo "  Our app path:      ${APP_PATH}"
            echo
            echo "Free port ${PORT} or stop the other app, then re-run deploy."
            echo "============================================"
            exit 1
          }

          OUR_PIDS="$(our_tree_pids | sort -u || true)"
          for pid in $(listen_pids); do
            if is_our_pid "$pid"; then
              echo "Port ${PORT} is held by ${PROCESS_NAME} (pid ${pid}) — restart is allowed."
              continue
            fi
            report_conflict "$pid"
          done

          if pm2 describe "$PROCESS_NAME" >/dev/null 2>&1; then
            echo "Restarting ${PROCESS_NAME} with PORT=${PORT}"
            pm2 restart "$PROCESS_NAME" --update-env
          else
            echo "Starting ${PROCESS_NAME} with PORT=${PORT}"
            pm2 start npm --name "$PROCESS_NAME" -- start
          fi
          pm2 save

          PM2_ID="$(pm2 id "$PROCESS_NAME" | tr -d '[][:space:]')"
          if [ -z "$PM2_ID" ]; then
            echo "ERROR: ${PROCESS_NAME} did not register with PM2 after start."
            exit 1
          fi
          if ! pm2 env "$PM2_ID" | grep -E -q "^PORT[=:][[:space:]]*${PORT}$"; then
            echo "ERROR: ${PROCESS_NAME} is not running with PORT=${PORT}."
            echo "PM2 environment:"
            pm2 env "$PM2_ID" || true
            exit 1
          fi
          echo "PM2 process ${PROCESS_NAME} is running with PORT=${PORT}"